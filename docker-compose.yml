services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: metis
      POSTGRES_PASSWORD: metis
      POSTGRES_DB: metis
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis -d metis"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin the public issuer so a token's `iss` is identical whether it was
      # obtained via the browser (localhost) or a back-channel container call.
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/metis-realm.json:/opt/keycloak/data/import/metis-realm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://metis:metis@postgres:5432/metis
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Auth — browser-facing issuer is fixed to localhost (see keycloak.KC_HOSTNAME);
      # the backend reaches Keycloak over the compose network for JWKS + Admin API.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/metis}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: metis
      KEYCLOAK_AUDIENCE: metis-backend
      KEYCLOAK_ADMIN_CLIENT_ID: metis-backend
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${METIS_BACKEND_CLIENT_SECRET:-dev-backend-secret}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      # The demo seed only runs on a database with no seeded rows at all, so a
      # partially-unseeded instance is left alone rather than colliding. Set to
      # false to skip it on a fresh database too.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Read-only MCP server. Same image as the backend, different command — it is
  # a client of the API, not a second copy of it. Its token is issued to
  # metis-mcp, so the backend refuses any write from it with a 403 naming the
  # screen that can act. Opt in with: docker compose --profile mcp up -d
  mcp:
    build: ./backend
    profiles: ["mcp"]
    command: ["python", "-m", "app.mcp", "--sse", "--port", "8001"]
    env_file:
      - path: .env
        required: false
    environment:
      MCP_API_BASE_URL: http://backend:8000
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: metis
      KEYCLOAK_MCP_CLIENT: metis-mcp
      KEYCLOAK_MCP_CLIENT_SECRET: ${METIS_MCP_CLIENT_SECRET:-dev-mcp-secret}
      # Callers must present this. The server refuses to start SSE without it,
      # because this process holds an API token and an open port would lend it
      # to anyone who can reach the address.
      MCP_SSE_TOKEN: ${METIS_MCP_SSE_TOKEN:-dev-mcp-sse-token}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
    # Reachable on the compose network only. Publish deliberately, with a real
    # MCP_SSE_TOKEN, if something outside needs it.
    expose:
      - "8001"
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      # Browser-facing issuer (localhost) for authorize/logout redirects; the
      # internal URL is used for server-side (back-channel) token exchange.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/metis}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: metis
      METIS_WEB_CLIENT_ID: metis-web
      METIS_WEB_CLIENT_SECRET: ${METIS_WEB_CLIENT_SECRET:-dev-web-secret}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-me-32bytes!}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:4321}
    ports:
      - "4321:4321"
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy

volumes:
  pgdata:
